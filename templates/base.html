<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon Backend Admin</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
    nav { background: #111827; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; }
    nav a { color: white; margin-left: 0.75rem; text-decoration: none; }
    .container { max-width: 1200px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    form { display: flex; flex-direction: column; gap: 0.8rem; }
    input, select, button, textarea { padding: 0.8rem; border-radius: 8px; border: 1px solid #d1d5db; }
    button { background: #2563eb; color: white; cursor: pointer; border: none; }
    .message { margin-top: 1rem; padding: 0.8rem; border-radius: 8px; }
    .message.success { background: #dcfce7; color: #166534; }
    .message.error { background: #fee2e2; color: #991b1b; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem; background: #f9fafb; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
    .actions button { margin-right: 0.5rem; padding: 0.45rem 0.7rem; }
    .pill { display: inline-block; padding: 0.25rem 0.65rem; border-radius: 999px; background: #e0f2fe; color: #0369a1; font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav>
    <strong>Salon Backend Admin</strong>
    <div>
      <a href="/">Home</a>
      <a href="/dashboard/">Dashboard</a>
      <a href="/products/">Products</a>
      <a href="/categories/">Categories</a>
      <a href="/brands/">Brands</a>
      <a href="/inventory/">Inventory</a>
      <a href="/customers/">Customers</a>
      <a href="/orders/">Orders</a>
      <a href="/payments/">Payments</a>
      <a href="/deliveries/">Deliveries</a>
      <a href="/receipts/">Receipts</a>
      <a href="/reports/">Reports</a>
      <a href="/register/">Register</a>
      <a href="/login/">Login</a>
      <a href="/profile/">Profile</a>
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
