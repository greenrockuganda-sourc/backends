{% extends 'base.html' %}
{% block content %}
<h2>Product Management</h2>
<form id="product-form">
  <input name="product_name" placeholder="Product name" required>
  <input name="sku" placeholder="SKU">
  <input name="barcode" placeholder="Barcode">
  <input name="category_id" placeholder="Category ID">
  <input name="brand_id" placeholder="Brand ID">
  <input name="buying_price" placeholder="Buying price" type="number" step="0.01">
  <input name="selling_price" placeholder="Selling price" type="number" step="0.01">
  <input name="quantity_in_stock" placeholder="Stock" type="number" value="0">
  <input name="reorder_level" placeholder="Reorder level" type="number" value="0">
  <input name="status" placeholder="Status" value="Available">
  <input name="description" placeholder="Description">
  <input name="image_url" placeholder="Image URL">
  <button type="submit">Save product</button>
</form>
<div id="message" class="message"></div>
<input id="search-box" placeholder="Search products" style="margin-top: 1rem; width: 100%;" />
<table>
  <thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Brand</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
  <tbody id="product-list"></tbody>
</table>
<script>
  const token = localStorage.getItem('accessToken');
  const form = document.getElementById('product-form');
  const list = document.getElementById('product-list');
  const searchBox = document.getElementById('search-box');
  const message = document.getElementById('message');
  let editingId = null;

  function showMessage(text, type) {
    message.className = 'message ' + type;
    message.textContent = text;
  }

  function resetForm() {
    form.reset();
    editingId = null;
    form.querySelector('button').textContent = 'Save product';
  }

  async function loadProducts() {
    if (!token) {
      list.innerHTML = '<tr><td colspan="8">Please log in as an admin.</td></tr>';
      return;
    }
    const query = searchBox.value.trim();
    const response = await fetch('/api/products/?search=' + encodeURIComponent(query), { headers: { Authorization: 'Bearer ' + token } });
    const result = await response.json();
    if (!response.ok) throw new Error(result.detail || 'Unable to load products');
    list.innerHTML = (result.results || []).map(product => `
      <tr>
        <td>${product.product_name}</td>
        <td>${product.sku || ''}</td>
        <td>${product.category?.category_name || ''}</td>
        <td>${product.brand?.brand_name || ''}</td>
        <td>${product.selling_price}</td>
        <td>${product.quantity_in_stock}</td>
        <td>${product.status}</td>
        <td class="actions">
          <button type="button" onclick="editProduct(${product.id})">Edit</button>
          <button type="button" onclick="deleteProduct(${product.id})">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  window.editProduct = async function(id) {
    const response = await fetch('/api/products/' + id + '/', { headers: { Authorization: 'Bearer ' + token } });
    const product = await response.json();
    if (!response.ok) return;
    editingId = id;
    Object.entries(product).forEach(([key, value]) => {
      if (form.elements[key]) {
        form.elements[key].value = value || '';
      }
    });
    form.querySelector('button').textContent = 'Update product';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.deleteProduct = async function(id) {
    const response = await fetch('/api/products/' + id + '/', { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } });
    const result = await response.json();
    if (!response.ok) {
      showMessage(result.detail || 'Delete failed', 'error');
      return;
    }
    showMessage(result.message || 'Deleted', 'success');
    loadProducts();
  };

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    const payload = {
      category_id: data.category_id ? Number(data.category_id) : null,
      brand_id: data.brand_id ? Number(data.brand_id) : null,
      product_name: data.product_name,
      sku: data.sku,
      barcode: data.barcode,
      buying_price: data.buying_price,
      selling_price: data.selling_price,
      quantity_in_stock: data.quantity_in_stock ? Number(data.quantity_in_stock) : 0,
      reorder_level: data.reorder_level ? Number(data.reorder_level) : 0,
      status: data.status,
      description: data.description,
      image_url: data.image_url
    };
    const method = editingId ? 'PUT' : 'POST';
    const response = await fetch('/api/products/' + (editingId || ''), {
      method,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(payload)
    });
    const result = await response.json();
    if (!response.ok) {
      showMessage(result.detail || JSON.stringify(result), 'error');
      return;
    }
    showMessage(editingId ? 'Product updated' : 'Product created', 'success');
    resetForm();
    loadProducts();
  });

  searchBox.addEventListener('input', loadProducts);
  loadProducts().catch(error => showMessage(error.message, 'error'));
</script>
{% endblock %}
