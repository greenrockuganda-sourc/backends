{% extends 'base.html' %}
{% block content %}
<h2>Reset Password</h2>
<form id="reset-form">
  <input id="uid" name="uid" placeholder="Reset UID" required>
  <input id="token" name="token" placeholder="Reset token" required>
  <input name="new_password" type="password" placeholder="New password" required>
  <input name="confirm_password" type="password" placeholder="Confirm password" required>
  <button type="submit">Reset password</button>
</form>
<div id="message"></div>
<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('uid').value = params.get('uid') || '';
  document.getElementById('token').value = params.get('token') || '';
  const form = document.getElementById('reset-form');
  const message = document.getElementById('message');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    const response = await fetch('/api/auth/reset-password/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const result = await response.json();
    message.className = 'message ' + (response.ok ? 'success' : 'error');
    message.textContent = result.message || JSON.stringify(result);
  });
</script>
{% endblock %}
