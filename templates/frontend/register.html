{% extends 'base.html' %}
{% block content %}
<h2>Create Account</h2>
<p>Create a customer account that can later place orders through the storefront APIs.</p>
<form id="register-form">
  <input name="first_name" placeholder="First name" required>
  <input name="last_name" placeholder="Last name" required>
  <input name="salon_name" placeholder="Salon name" required>
  <input name="location" placeholder="Salon location" required>
  <input name="email" type="email" placeholder="Email (optional)">
  <input name="phone_number" placeholder="Phone number (optional)">
  <small>Enter an email address, a phone number, or both.</small>
  <input name="password" type="password" placeholder="Password" required>
  <button type="submit">Register</button>
</form>
<div id="message"></div>
<script>
  const form = document.getElementById('register-form');
  const message = document.getElementById('message');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    const response = await fetch('/api/auth/register/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const result = await response.json();
    message.className = 'message ' + (response.ok ? 'success' : 'error');
    message.textContent = result.message || JSON.stringify(result);
  });
</script>
{% endblock %}
